<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>理财投后异动服务报告</title><!-- 视觉决策卡：brand；以异动事件为主角，事件卡用于筛选，双栏用于对象选择与服务处理；红色仅指示风险异动。 --><style>

:#f8faff;border-left:3px solid #84adff;border-radius:3px}.empty{padding:38px;text-align:center;color:var(--m)}.mask{position:fixed;inset:0;background:#10182870;z-index:10;display:none;align-items:center;justify-content:center}.mask.show{display:flex}.modal{width:650px;max-width:92vw;max-height:84vh;overflow:auto;background:#fff;border-radius:9px}.modalhead,.modalfoot{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--l)}.modalfoot{border-top:1px solid var(--l);border-bottom:0;justify-content:flex-end;gap:8px}.modalbody{padding:18px;line-height:1.8;color:var(--t)}.close{border:0;background:transparent;color:var(--m);font-size:22px;cursor:pointer}.toast{position:fixed;z-index:20;top:22px;left:50%;transform:translateX(-50%);display:none;padding:11px 17px;border-radius:7px;background:#1d2939;color:#fff}.toast.show{display:block}@media(max-width:960px){.page{padding:14px}.top{display:block}.metrics{margin-top:18px}.events,.workspace,.stats{grid-template-columns:1fr}.list{max-height:300px}}
</style></head><body><main class="page"><section class="top"><div><h1 class="title">理财投后异动服务报告</h1><div class="sub">汇总已生成的组合与大类资产异动服务任务，按客户或产品开展后续服务</div></div><div class="metrics"><div class="metric"><label>组合异动</label><b>2</b></div><div class="metric"><label>大类资产异动</label><b>3</b></div><div class="metric"><label>影响客户</label><b>128</b></div><div class="metric"><label>影响产品</label><b>17</b></div></div></section><section class="filterbar"><div class="seg" id="filters"><button class="active" onclick="filterType('all',this)">全部异动（5）</button><button onclick="filterType('combo',this)">组合层面异动（2）</button><button onclick="filterType('asset',this)">大类资产层面异动（3）</button></div><div id="eventList" class="events"></div></section><section class="tools"><div class="seg"><button class="active" id="cv" onclick="setMode('customer')">按客户维度</button><button id="pv" onclick="setMode('product')">按产品维度</button></div><span class="muted" id="modeTip">选择客户，查看命中异动、服务报告与沟通话术</span></section><div class="workspace"><aside class="panel"><div class="head"><h2 id="listTitle">受影响客户（128）</h2></div><div class="searchwrap"><input id="search" class="search" placeholder="搜索客户姓名或资金账号"></div><button id="broadcast" class="listaction" onclick="openBroadcast()"><span>✈　企微一键群发</span><span>⌄</span></button><div class="list" id="list"></div></aside><section class="panel"><div class="detail" id="detail"></div></section></div></main><div id="mask" class="mask" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><b id="modalTitle">服务报告预览</b><button class="close" onclick="closeModal()">×</button></div><div id="modalBody" class="modalbody"></div><div class="modalfoot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="confirmSend()">确认发送</button></div></div></div><div id="toast" class="toast"></div><script>
const events=[{type:'asset',name:'黄金 Au9999',kind:'大类资产',value:'当日 -2.56%',rule:'单日跌幅超过 2.5%',customers:86,products:8},{type:'combo',name:'全球稳健配置组合',kind:'组合',value:'连续 3 日累计 -1.02%',rule:'连续 3 个交易日回撤超过 1%',customers:54,products:5},{type:'asset',name:'沪深 300',kind:'大类资产',value:'连续 4 日累计 -3.18%',rule:'连续回撤触发观察线',customers:42,products:4}];const customers=[{n:'张晓雯',a:'010238',r:'C3（中风险承受）',t:'682.4 万',f:'516.8 万',i:'248.6 万',p:'36.4%',ps:[['百分安心·全球稳健配置','168.2 万','+4.82%',['全球稳健配置组合｜组合层面｜连续 3 日累计 -1.02%','黄金 Au9999｜大类资产｜当日 -2.56%']],['华安黄金 ETF 联接 A','80.4 万','+7.15%',['黄金 Au9999｜大类资产｜当日 -2.56%']]]},{n:'李承泽',a:'019472',r:'C4（中高风险承受）',t:'648.5 万',f:'472.8 万',i:'186.2 万',p:'28.7%',ps:[['稳健宝固收+组合','119.6 万','+2.36%',['全球稳健配置组合｜组合层面｜连续 3 日累计 -1.02%']],['博时黄金 ETF 联接 C','66.6 万','+5.47%',['黄金 Au9999｜大类资产｜当日 -2.56%']]]},{n:'周思远',a:'023108',r:'专业投资者（无需测评）',t:'438.2 万',f:'312.6 万',i:'96.8 万',p:'22.1%',ps:[['全球进取多资产组合','64.2 万','+1.18%',['沪深 300｜大类资产｜连续 4 日累计 -3.18%']],['华夏沪深 300 ETF 联接','32.6 万','-1.26%',['沪深 300｜大类资产｜连续 4 日累计 -3.18%']]]}];const products=[{n:'百分安心·全球稳健配置',type:'多资产组合',p:'32.6%',v:'连续 3 日累计 -1.02%',h:[['张晓雯','168.2 万','+4.82%'],['李承泽','119.6 万','+2.36%']]},{n:'华安黄金 ETF 联接 A',type:'大类资产基金',p:'28.4%',v:'当日 -2.56%',h:[['张晓雯','80.4 万','+7.15%'],['周思远','32.6 万','-1.26%']]}];let mode='customer',sel=0,type='all';const $=x=>document.getElementById(x);function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function renderEvents(){let rows=events.filter(e=>type==='all'||e.type===type);$('eventList').innerHTML=rows.map((e,i)=>`<button class="event ${i===0?'active':''}" onclick="selectEvent('${e.name}',this)"><span class="tag">${e.kind}</span><b>${e.name}</b><small>${e.value} · ${e.rule}<br>影响客户 ${e.customers}　影响产品 ${e.products}</small></button>`).join('')}function filterType(t,el){type=t;document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderEvents();renderList()}function selectEvent(n,el){document.querySelectorAll('.event').forEach(e=>e.classList.remove('active'));el.classList.add('active');toast('已按“'+n+'”更新服务清单')}function setMode(m){mode=m;sel=0;$('cv').classList.toggle('active',m==='customer');$('pv').classList.toggle('active',m==='product');$('listTitle').textContent=m==='customer'?'受影响客户（128）':'受影响产品（17）';$('search').placeholder=m==='customer'?'搜索客户姓名或资金账号':'搜索产品名称';$('broadcast').style.display=m==='customer'?'flex':'none';$('modeTip').textContent=m==='customer'?'选择客户，查看命中异动、服务报告与沟通话术':'选择产品，查看异动说明、持有客户与产品话术';$('search').value='';renderList();renderDetail()}function renderList(){let q=$('search').value.trim();if(mode==='customer'){let rows=customers.filter(c=>(c.n+c.a).includes(q));$('list').innerHTML=rows.length?rows.map(c=>{let i=customers.indexOf(c);return `<div class="item ${i===sel?'active':''}" onclick="pick(${i})"><div class="line"><span class="name">${c.n}</span><span class="risk">${c.r}</span></div><div class="small">资金账号 ${c.a}</div><div class="impact">受影响 ${c.i} · ${c.p}</div></div>`}).join(''):'<div class="empty">未找到匹配客户</div>'}else{let rows=products.filter(p=>p.n.includes(q));$('list').innerHTML=rows.length?rows.map(p=>{let i=products.indexOf(p);return `<div class="item ${i===sel?'active':''}" onclick="pick(${i})"><div class="line"><span class="name">${p.n}</span><span class="risk">${p.type}</span></div><div class="small">${p.v}</div><div class="impact">受影响比例 ${p.p}</div></div>`}).join(''):'<div class="empty">未找到匹配产品</div>'}}function pick(i){sel=i;renderList();renderDetail()}function renderDetail(){if(mode==='customer'){let c=customers[sel];$('detail').innerHTML=`<div class="detailtop"><div><h1>${c.n} · 客户异动服务详情</h1><div class="muted">资金账号 ${c.a}　·　${c.r}</div></div></div><div class="stats"><div class="stat"><label>客户整体持仓</label><b>${c.t}</b></div><div class="stat"><label>客户理财持仓</label><b>${c.f}</b></div><div class="stat"><label>受影响持仓</label><b class="red">${c.i}</b></div><div class="stat"><label>受影响占比</label><b class="red">${c.p}</b></div></div><div class="card"><div class="cardhead"><b>受影响产品与命中异动</b></div><div class="body"><table><tr><th>产品名称</th><th>持仓金额</th><th>持仓收益率</th><th>命中异动</th></tr>${c.ps.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3].map(h=>'<span class="hit">'+h+'</span>').join('')}</td></tr>`).join('')}</table></div></div><div class="card"><div class="cardhead"><b>异动服务报告</b><div><button class="btn" onclick="preview()">查看完整报告</button><button class="btn" onclick="toast('报告图片已准备下载')">下载图片</button></div></div><div class="body">黄金及相关资产出现明显波动，受影响资产合计 ${c.i}，占理财持仓 ${c.p}。建议结合风险承受能力关注资产分散及市场后续变化。</div></div><div class="card"><div class="cardhead"><b>沟通话术</b><div><button class="btn" onclick="toast('话术已复制')">复制话术</button><button class="btn primary" onclick="toast('已通过企微发送给 ${c.n}')">企微发送</button></div></div><div class="body"><div class="speech">您好，近期您的部分持仓资产触发市场异动，我已整理本次影响与后续关注建议，您可以先查看。</div></div></div>`}else{let p=products[sel];$('detail').innerHTML=`<div class="detailtop"><div><h1>${p.n}</h1><div class="muted">${p.type}　·　${p.v}</div></div><button class="btn primary" onclick="openBroadcast(true)">按产品一键群发</button></div><div class="stats"><div class="stat"><label>受影响比例</label><b class="red">${p.p}</b></div><div class="stat"><label>当前异动值</label><b class="red">${p.v}</b></div><div class="stat"><label>报告形式</label><b>千人一面</b></div><div class="stat"><label>持有客户</label><b>${p.h.length} 人</b></div></div><div class="card"><div class="cardhead"><b>异动服务报告</b><button class="btn" onclick="preview()">查看完整报告</button></div><div class="body">${p.n}触发${p.v}规则。建议向持有客户同步市场变化与后续观察重点。</div></div><div class="card"><div class="cardhead"><b>沟通话术</b><button class="btn" onclick="toast('话术已复制')">复制话术</button></div><div class="body"><div class="speech">您好，您持有的${p.n}近期出现${p.v}，我把本次异动的背景和后续安排整理成一份说明。</div></div></div><div class="card"><div class="cardhead"><b>持有客户（${p.h.length} 人）</b></div><div class="body"><table><tr><th>客户姓名</th><th>持仓资产</th><th>持有收益</th><th>操作</th></tr>${p.h.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td><button class="btn" onclick="toast('已定位到${x[0]}')">查看详情</button></td></tr>`).join('')}</table></div></div>`}}function preview(){$('modalTitle').textContent='异动服务报告预览';$('modalBody').innerHTML='<b>异动服务报告（演示）</b><p>报告包含异动说明、影响范围、客户持仓影响和服务建议。</p>';$('mask').classList.add('show')}function openBroadcast(product=false){let rows=product?products[sel].h.map(x=>x[0]):customers.map(x=>x.n);$('modalTitle').textContent=product?'按产品一键群发':'企微一键群发';$('modalBody').innerHTML=`<p>${product?'将发送同一份产品服务报告与沟通话术':'将按客户持仓生成千人千面报告与沟通话术'}</p>${rows.map(n=>`<label style="display:flex;padding:10px 0;border-bottom:1px solid #eee"><input type="checkbox" checked style="margin-right:9px">${n}</label>`).join('')}`;$('mask').classList.add('show')}function closeModal(){$('mask').classList.remove('show')}function confirmSend(){let n=document.querySelectorAll('#modalBody input:checked').length;closeModal();toast('已通过企微群发发送给 '+n+' 位客户')}$('search').oninput=renderList;renderEvents();renderList();renderDetail();
</script><script>
/* 产品详情：异动是事件集合，不以单一“当前异动值”替代事件口径。 */
const productEventMap={
  '百分安心·全球稳健配置':[
    {name:'全球稳健配置组合',layer:'组合层面',metric:'连续 3 日累计收益率',value:'-1.02%',rule:'连续 3 个交易日回撤超过 1%',basis:'该产品为此组合的底层持仓'}

  '华安黄金 ETF 联接 A':[

    {name:'全球稳健配置组合',layer:'组合层面',metric:'连续 3 日累计收益率',value:'-1.02%',rule:'连续 3 个交易日回撤超过 1%',basis:'被纳入全球稳健配置组合'}
  ]
};
const baseRenderDetail=renderDetail;
renderDetail=function(){
  baseRenderDetail();
  if(mode!=='product')return;
  const product=products[sel], rows=productEventMap[product.n]||[];
  const stats=$('detail').querySelector('.stats');
  if(stats){
    stats.innerHTML=`<div class="stat"><label>受影响比例</label><b class="red">${product.p}</b></div><div class="stat"><label>报告形式</label><b>千人一面</b></div><div class="stat"><label>持有客户</label><b>${product.h.length} 人</b></div>`;
  }
  const eventSection=`<div class="card product-event-card"><div class="cardhead"><b>命中异动事件（${rows.length}）</b><span class="muted">按事件层级展示</span></div><div class="body"><table><tr><th>异动事件</th><th>观测指标 / 实际值</th><th>触发条件</th><th>产品匹配依据</th></tr>${rows.map(e=>`<tr><td><b>${e.name}</b><br><span class="hit">${e.layer}</span></td><td>${e.metric}<br><b class="red">${e.value}</b></td><td>${e.rule}</td><td>${e.basis}</td></tr>`).join('')}</table></div></div>`;
  const reportCard=$('detail').querySelector('.card');

renderDetail();
</script><script>
/* 默认是“全部异动”汇总态；只有主动点击事件卡片才进入单事件筛选态。 */
window.selectedEventName = null;
renderEvents = function(){
  const rows = events.filter(e => type === 'all' || e.type === type);
  $('eventList').innerHTML = rows.map(e => `<button class="event ${window.selectedEventName===e.name?'active':''}" onclick="selectEvent('${e.name}',this)"><span class="tag">${e.kind}</span><b>${e.name}</b><small>${e.value} · ${e.rule}<br>影响客户 ${e.customers}　影响产品 ${e.products}</small></button>`).join('');
};
filterType = function(nextType, el){
  type = nextType;
  window.selectedEventName = null;
  document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderEvents();
  renderList();
  $('modeTip').textContent = mode === 'customer' ? '全部异动汇总：选择客户，查看命中异动、服务报告与沟通话术' : '全部异动汇总：选择产品，查看异动说明、持有客户与产品话术';
};
selectEvent = function(name, el){
  window.selectedEventName = name;
  document.querySelectorAll('.event').forEach(card => card.classList.remove('active'));

  $('modeTip').textContent = '当前仅查看“' + name + '”的受影响对象；点击“全部异动（5）”返回汇总范围';

renderEvents();
</script><script>
/* 报告弹窗是纯预览；群发弹窗才展示发送确认。 */

  $('modalBody').innerHTML = '<b>异动服务报告（演示）</b><p>报告包含异动说明、影响范围、客户持仓影响和服务建议。</p>';
  modalFoot('<button class="btn primary" onclick="closeModal()">关闭预览</button>');

    {id:'r-c-023108-oil',name:'原油资产异动服务报告',eventName:'原油',eventType:'大类资产层面',context:'报告 Skill 未返回可用文件，请在上游任务中重试。',status:'error'}
  ];
  products[0].reports=[
    {id:'r-p-steady-combo',name:'全球稳健配置组合异动服务报告',eventName:'全球稳健配置组合',eventType:'组合层面',context:'全球稳健配置组合连续 3 日累计回撤 -1.02%，报告说明本次异动与后续关注重点。',status:'ready'},
    {id:'r-p-steady-gold',name:'黄金资产异动服务报告',eventName:'黄金 Au9999',eventType:'大类资产层面',context:'黄金 Au9999 当日跌幅 -2.56%，报告说明相关资产波动及服务关注重点。',status:'ready'}
  ];
  products[1].reports=[
    {id:'r-p-gold',name:'黄金资产异动服务报告',eventName:'黄金 Au9999',eventType:'大类资产层面',context:'黄金 Au9999 当日跌幅 -2.56%，报告说明产品关联资产的市场变化和后续关注重点。',status:'ready'}
  ];
  products[2].reports=[
    {id:'r-p-shortbond',name:'短债优享组合异动服务报告',eventName:'短债优享组合',eventType:'组合层面',context:'短债优享组合当日收益率 -0.42%，报告说明本次异动和后续观察重点。',status:'ready'}
  ];
  products[3].reports=[];
  products[4].reports=[
    {id:'r-p-oil',name:'原油资产异动服务报告',eventName:'原油',eventType:'大类资产层面',context:'报告 Skill 未返回可用文件，请在上游任务中重试。',status:'error'}
  ];

  const htmlEscape=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  const ownerForReport=()=>mode==='customer'?customers[sel]:products[sel];
  const ownerKey=owner=>mode==='customer'?owner.a:owner.n;
  const reportsForCurrentScope=owner=>{
    const reports=Array.isArray(owner.reports)?owner.reports:[];
    if(window.selectedEventName)return reports.filter(report=>report.eventName===window.selectedEventName);
    if(type==='all')return reports;
    return reports.filter(report=>type==='combo'?report.eventType.includes('组合'):report.eventType.includes('资产'));
  };
  const renderDetailBeforeReportFiles=renderDetail;
  renderDetail=function(){
    renderDetailBeforeReportFiles();
    const reportCard=[...$('detail').querySelectorAll('.card')].find(card=>card.querySelector('.cardhead b')?.textContent.trim()==='异动服务报告');
    if(!reportCard)return;
    const owner=ownerForReport();
    const files=reportsForCurrentScope(owner);
    reportCard.classList.add('report-files-card');
    reportCard.innerHTML=`<div class="cardhead"><b>异动服务报告</b><span class="muted">${files.length?'共 '+files.length+' 份':'无可用报告文件'}</span></div><div class="body">${files.length?`<div class="report-file-strip" aria-label="异动服务报告文件列表">${files.map(file=>file.status==='ready'?`<article class="report-file"><div class="report-file-meta"><span class="report-file-kind">${htmlEscape(file.eventType)}</span><span>可用</span></div><h3>${htmlEscape(file.name)}</h3><p class="report-file-event">关联异动：<b>${htmlEscape(file.eventName)}</b></p><div class="report-file-actions"><button type="button" class="btn" onclick="previewReportFile('${file.id}','${ownerKey(owner)}')">预览</button><button type="button" class="btn" onclick="downloadReportFile('${file.id}','${ownerKey(owner)}')">下载</button></div></article>`:`<article class="report-file error"><div class="report-file-meta"><span class="report-file-kind">${htmlEscape(file.eventType)}</span><span>文件异常</span></div><h3>${htmlEscape(file.name)}</h3><p class="report-file-event">关联异动：<b>${htmlEscape(file.eventName)}</b></p><p class="report-file-error-note">报告文件暂不可用，请在上游任务中重试。</p></article>`).join('')}</div><div class="report-files-tip">横向滚动可查看全部报告文件</div>`:'<div class="report-file-empty">当前筛选范围没有可用的异动服务报告文件。</div>'}</div>`;
  };
  window.previewReportFile=function(id,key){
    const owner=ownerForReport();
    if(ownerKey(owner)!==key)return;
    const file=(owner.reports||[]).find(item=>item.id===id);
    if(!file||file.status!=='ready')return;
    $('modalTitle').textContent=file.name;
    $('modalBody').innerHTML=longReport(file.name,file.context);
    modalFoot('<button class="btn primary" onclick="closeModal()">关闭预览</button>');
    $('mask').classList.add('show');
  };
  window.downloadReportFile=function(id,key){
    const owner=ownerForReport();
    if(ownerKey(owner)!==key)return;
    const file=(owner.reports||[]).find(item=>item.id===id);
    if(!file||file.status!=='ready')return;
    const escapeXml=value=>htmlEscape(value).replace(/&#39;/g,'&apos;');
    const lines=[file.name,'关联异动：'+file.eventName,'异动层级：'+file.eventType,file.context];
    const text=lines.map((line,index)=>`<text x="48" y="${84+index*54}" font-size="${index===0?28:18}" font-weight="${index===0?700:400}" fill="${index===0?'#101828':'#344054'}">${escapeXml(line)}</text>`).join('');
    const image=`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="900" height="400" fill="#ffffff"/><rect width="900" height="12" fill="#2b73ff"/><text x="48" y="48" font-size="14" fill="#2b73ff">投后服务报告</text>${text}<text x="48" y="348" font-size="14" fill="#667085">本报告仅用于投后服务信息解读，不构成投资建议或收益承诺。</text></svg>`;
    const blob=new Blob([image],{type:'image/svg+xml;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');link.href=url;link.download=file.name+'.svg';link.click();
    setTimeout(()=>URL.revokeObjectURL(url),0);
    toast('《'+file.name+'》已开始下载');
  };
  renderDetail();
})();
</script>
