/* ===== 国金证券 B端设计规范 CSS变量（深蓝主题，与投后场景保持一致）===== */
:root {
  --color-primary: #1A2A5E;
  --color-primary-mid: #2B3F7A;
  --color-accent: #2B73FF;
  --color-primary-light: #EEF1F8;
  --color-text-primary: #1A2A5E;
  --color-text-secondary: #4A5578;
  --color-text-tertiary: #8A96B4;
  --color-text-disabled: #C3CADC;
  --color-danger: #C8392B;
  --color-danger-bg: #FEF2F1;
  --color-info: #2B73FF;
  --color-warning: #C47520;
  --color-warning-bg: #FFF7EC;
  --color-border: #E4E9F2;
  --color-divider: #EEF1F8;
  --color-table-line: #EEF1F8;
  --color-table-header: #F7F9FC;
  --color-white: #FFFFFF;
  --color-success: #1A7F4E;
  --color-success-bg: #F0FAF4;
  --color-up: #C8392B;
  --color-down: #1A7F4E;
  --color-flat: #4A5578;
  --shadow-sm: 0 1px 4px rgba(26,42,94,0.06);
  --shadow: 0 2px 10px rgba(26,42,94,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #F0F3F8; color: var(--color-text-primary); padding: 0; }

.page { max-width: 960px; margin: 0 auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }

/* 头部 */
.header-bar { background: var(--color-primary); border-radius: 10px; padding: 20px 24px; color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 24px; box-shadow: var(--shadow); flex-wrap: wrap; }
.header-bar .h-left { flex: 1; min-width: 240px; }
.header-bar .h-title { font-size: 19px; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.2px; }
.header-bar .h-sub { font-size: 13px; opacity: 0.75; line-height: 1.5; }
.metrics-row { display: flex; gap: 12px; }
.metric-tile { background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); border-radius: 8px; padding: 10px 18px; text-align: center; min-width: 96px; }
.metric-tile .m-label { font-size: 11px; opacity: 0.7; margin-bottom: 4px; }
.metric-tile .m-value { font-size: 14px; font-weight: 700; }

.main-layout { display: flex; flex-direction: column; gap: 16px; }

.customer-card, .speech-card {
  background: #fff;
  border: 1px solid var(--color-border);
  border-radius: 10px;
  padding: 20px;
  box-shadow: var(--shadow-sm);
}
.c-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--color-divider); }
.c-name-row { display: flex; align-items: center; gap: 12px; }
.c-avatar {
  width: 48px; height: 48px;
  border-radius: 10px;
  background: var(--color-primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.c-info .c-name { font-size: 18px; font-weight: 800; color: var(--color-primary); }
.c-info .c-account { font-size: 12.5px; color: var(--color-text-tertiary); margin-top: 4px; }
.c-tag { font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 600; background: #EEF5FF; color: #2B5CC8; flex-shrink: 0; }
.c360-link { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 7px; background: #fff; color: var(--color-primary); border: 1px solid var(--color-border); font-size: 12.5px; font-weight: 700; text-decoration: none; cursor: pointer; transition: all .15s; flex-shrink: 0; }
.c360-link:hover { border-color: var(--color-accent); color: var(--color-accent); background: #EEF5FF; }
.c360-link svg { width: 14px; height: 14px; flex-shrink: 0; }

.profile-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 4px; }
.p-item { background: var(--color-table-header); border-radius: 8px; padding: 10px 14px; }
.p-item .p-label { font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 4px; }
.p-item .p-value { font-size: 14px; color: var(--color-primary); font-weight: 700; }

.report-section { border-top: 1px solid var(--color-divider); margin-top: 16px; padding-top: 16px; }
.report-label { font-size: 12.5px; color: var(--color-text-secondary); font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.report-label svg { width: 15px; height: 15px; }

.report-item { display: flex; gap: 12px; padding: 12px; background: var(--color-table-header); border-radius: 8px; align-items: flex-start; }
.report-thumb { width: 48px; height: 62px; border-radius: 6px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--color-primary); font-size: 11px; text-align: center; line-height: 1.3; background: #EEF5FF; }
.report-thumb .rt-icon { margin-bottom: 3px; display: flex; }
.report-thumb .rt-icon svg { width: 18px; height: 18px; }
.report-info { flex: 1; min-width: 0; }
.report-info .r-title { font-size: 14px; font-weight: 700; color: var(--color-text-primary); margin-bottom: 3px; }
.report-info .r-desc { font-size: 11.5px; color: var(--color-text-tertiary); margin-bottom: 10px; line-height: 1.5; }
.report-links { display: flex; gap: 8px; flex-wrap: wrap; }
.r-link { font-size: 12px; height: 30px; padding: 0 12px; border-radius: 6px; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s; text-decoration: none; font-weight: 600; }
.r-link svg { width: 13px; height: 13px; flex-shrink: 0; }
.r-link.view { background: var(--color-primary); color: #fff; border: 1px solid var(--color-primary); }
.r-link.view:hover { background: var(--color-primary-mid); }
.r-link.dl { background: #fff; color: var(--color-text-secondary); border: 1px solid var(--color-border); }
.r-link.dl:hover { border-color: var(--color-primary); color: var(--color-primary); }

/* 话术卡片 */
.speech-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.speech-label { font-size: 12.5px; color: var(--color-text-secondary); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.speech-label svg { width: 15px; height: 15px; }
.compliance-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; background: var(--color-success-bg); color: var(--color-success); transition: all 0.2s; }
.compliance-badge.pending { background: var(--color-warning-bg); color: var(--color-warning); }
.compliance-badge svg { width: 12px; height: 12px; }
.speech-textarea { width: 100%; min-height: 220px; border: 1px solid var(--color-border); border-radius: 8px; padding: 14px; font-size: 13px; line-height: 1.8; color: var(--color-text-primary); font-family: inherit; resize: vertical; outline: none; transition: border-color 0.2s, box-shadow 0.2s; background: var(--color-table-header); }
.speech-textarea:focus { border-color: var(--color-accent); box-shadow: 0 0 0 1.5px var(--color-accent); background: #fff; }
.speech-footer-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.char-count { font-size: 12px; color: var(--color-text-tertiary); }
.char-count .cc-num { color: var(--color-text-secondary); font-weight: 600; }
.reset-btn { font-size: 12px; color: var(--color-text-tertiary); cursor: pointer; background: none; border: none; display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 4px; transition: all 0.2s; font-family: inherit; }
.reset-btn:hover { background: var(--color-table-header); color: var(--color-text-secondary); }
.reset-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.speech-actions-row { display: flex; gap: 8px; margin-top: 12px; }
.d-btn { height: 34px; padding: 0 14px; border-radius: 7px; font-size: 12.5px; font-weight: 700; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s; font-family: inherit; }
.d-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.d-btn.primary { background: var(--color-primary); color: #fff; flex: 1; justify-content: center; }
.d-btn.primary:hover { background: var(--color-primary-mid); }

.footer-note { font-size: 12px; color: var(--color-text-tertiary); text-align: center; line-height: 1.6; padding: 16px 0 8px; }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--color-primary); color: rgba(255,255,255,0.9); font-size: 12px; padding: 8px 18px; border-radius: 16px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; box-shadow: 0 4px 16px rgba(26,42,94,0.25); white-space: nowrap; }
.toast.show { opacity: 1; }

@media (max-width: 720px) {
  .page { padding: 12px; }
  .header-bar { flex-direction: column; align-items: flex-start; }
  .profile-grid { grid-template-columns: repeat(2, 1fr); }
  .metrics-row { justify-content: flex-start; }
}
</style>

};

// ===================== 话术：编辑 / 复制 / 恢复 =====================
var originalSpeech = speechMap[ck] || speechMap['lixiufang'];
var speechBox = document.getElementById('speechBox');
var charCountEl = document.getElementById('speechCharCount');
var resetBtn = document.getElementById('speechResetBtn');
var badgeEl = document.getElementById('complianceBadge');

speechBox.value = originalSpeech;
charCountEl.textContent = originalSpeech.length;

function onSpeechEdit() {
  var text = speechBox.value;
  charCountEl.textContent = text.length;
  var isEdited = text !== originalSpeech;
  if (isEdited) {
    badgeEl.className = 'compliance-badge pending';
    badgeEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>已编辑 · 待复核';
    resetBtn.disabled = false;
  } else {
    badgeEl.className = 'compliance-badge';
    badgeEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 13 10 18 19 7"/></svg>合规审查通过';
    resetBtn.disabled = true;
  }
}

function resetSpeech() {
  speechBox.value = originalSpeech;
  onSpeechEdit();
  showToast('已恢复原始话术');
}

function copySpeech() {
  var text = speechBox.value;
  copyToClipboard(text);
  showToast('话术已复制到剪贴板');
}

function copyToClipboard(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(function() { t.classList.remove('show'); }, 2200);
}
</script>
</body>
