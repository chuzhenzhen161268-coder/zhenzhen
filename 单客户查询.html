var draftState = {}; // key -> { product, period, originalText }

function esc(s) { return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

// 从 URL 读取要展示的客户，例如 ?id=lw 或 ?account=6008801289；均未提供时默认展示第一个客户（便于预览）
function getTargetCustomer() {
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var account = params.get('account');
  if (id) return customers.filter(function(c){ return c.id === id; })[0] || null;
  if (account) return customers.filter(function(c){ return c.account === account; })[0] || null;
  return customers[0] || null;
}

function renderCustomerDetail() {
  var c = getTargetCustomer();
  if (!c) {
    document.getElementById('detailPanel').innerHTML = '';
    document.getElementById('noResult').classList.add('show');
    return;
  }
  document.getElementById('noResult').classList.remove('show');
  document.getElementById('hSub').textContent = esc(c.name) + ' · 单客户报告查询 · 国金证券基金投顾';

  var totalAsset = c.products.reduce(function(sum, p){ return sum + parseFloat(p.asset.replace(/[¥万]/g,'')); }, 0);
  var totalReports = c.products.reduce(function(sum, p){ return sum + p.reports.length; }, 0);

  var html = '<div class="detail-card">' +
    '<div class="detail-header">' +
      '<div class="dh-left">' +
        '<div class="c-avatar-lg">' + esc(c.name.charAt(0)) + '</div>' +
        '<div><div class="dh-name">' + esc(c.name) + '</div><div class="dh-account">资金账号 ' + c.account + ' · ' + '<span class="c-tag ' + c.riskClass + '">' + esc(c.riskTag) + '</span></div></div>' +
      '</div>' +
      '<a class="c360-link" href="' + esc(customer360Url(c)) + '" target="_blank" rel="noopener" title="打开客户视图查看完整客户详情">' +
        iconSvg('external') + '客户视图' +
      '</a>' +
    '</div>' +
    '<div class="c-summary-row">' +
      '<div class="c-summary-tile"><div class="cs-label">持仓资产合计</div><div class="cs-value">¥' + totalAsset.toFixed(2) + '万</div></div>' +
      '<div class="c-summary-tile"><div class="cs-label">最新报告</div><div class="cs-value">' + totalReports + ' 份</div></div>' +
    '</div>' +
  '</div>';

  c.products.forEach(function(p) {
    html += renderProductGroup(p);
  });

  document.getElementById('detailPanel').innerHTML = html;

  c.products.forEach(function(p) {
    var defaultPeriod = p.type === 'single_fund' ? 'monthly' : 'quarterly';
    initDraft(p.key, p.type, defaultPeriod);
  });
}

function renderProductGroup(p) {
  var reportsHtml = p.reports.map(function(r) {
    return '<div class="report-item">' +
      '<div class="report-thumb"><div class="rt-icon">' + iconSvg(r.icon) + '</div>' + r.label + '</div>' +
      '<div class="report-info">' +
        '<div class="r-title">' + esc(r.title) + '</div>' +
        '<div class="r-desc">' + esc(r.desc) + '</div>' +
        '<div class="report-actions">' +
          '<a class="r-btn view" href="' + reportsBase + esc(r.file) + '" target="_blank">' + iconSvg('eye') + '查看</a>' +
          '<button class="r-btn dl-img" onclick="downloadReport(\'' + esc(r.dlName) + '\',\'image\')">' + iconSvg('download') + '下载图片</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  // 周期切换器：几种周期的报告，话术就能切几版
  var periods = Array.from(new Set(p.reports.map(function(r){ return r.icon; }))).filter(function(k){
    return k === 'quarterly' || k === 'monthly' || k === 'weekly';
  });
  var periodLabels = { quarterly: '季报', monthly: '月报', weekly: '周报' };
  var defaultPeriod = p.type === 'single_fund' ? 'monthly' : 'quarterly';
  var periodSelector = periods.length > 1
    ? '<div class="period-selector" id="ps-' + p.key + '">' +
        periods.map(function(period, idx) {
          return (idx > 0 ? '<span class="ps-sep">|</span>' : '') +
            '<span class="ps-item' + (period === defaultPeriod ? ' active' : '') + '" data-period="' + period + '" onclick="switchDraftPeriod(\'' + p.key + '\',\'' + period + '\')">' + periodLabels[period] + '</span>';
        }).join('') +
      '</div>'
    : '';

  return '<div class="product-group">' +
    '<div class="pg-header">' +
      '<div class="pgh-name"><div class="pgh-icon">' + iconSvg(p.type === 'portfolio' ? 'portfolio' : 'doc') + '</div>' + esc(p.name) + '</div>' +
      '<div class="pgh-tag">' + (p.type === 'portfolio' ? '基金投顾' : '公募基金') + '</div>' +
    '</div>' +
    '<div class="pg-holdings"><span class="pgh-asset">持仓资产 ' + p.asset + '</span><span class="pgh-return">持有收益 ' + p.ret + '</span></div>' +
    '<div class="report-list">' + reportsHtml + '</div>' +
    '<div class="speech-section">' +
      '<div class="draft-card" id="draft-' + p.key + '">' +
        '<div class="draft-header-row">' +
          '<div class="dhr-left">' +
            '<div class="dhr-title">沟通话术</div>' +
            periodSelector +
            '<div class="ai-badge">✨ AI提炼</div>' +
          '</div>' +
          '<div class="compliance-badge passed">✓ 合规审核通过</div>' +
        '</div>' +
        '<textarea class="draft-textarea" oninput="onDraftEdit(\'' + p.key + '\')"></textarea>' +
        '<div class="draft-footer-row">' +
          '<div class="char-count">共 <span class="cc-num">0</span> 字</div>' +
          '<button class="reset-btn" disabled onclick="resetDraft(\'' + p.key + '\')">↺ 恢复原始话术</button>' +
        '</div>' +
        '<div class="draft-actions-row">' +
          '<button class="d-btn secondary" onclick="copyDraft(\'' + p.key + '\')">⧉ 复制话术</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// ===================== 话术公共逻辑 =====================
function getDraftText(product, period) {
  var lib = draftLib[product] || {};
  return lib[period] || lib.quarterly || lib.monthly || '';
}

function initDraft(draftKey, product, period) {
  var card = document.getElementById('draft-' + draftKey);
  if (!card) return;
  var text = getDraftText(product, period);
  var textarea = card.querySelector('.draft-textarea');
  textarea.value = text;
  card.querySelector('.cc-num').textContent = text.length;
  draftState[draftKey] = { product: product, period: period, originalText: text };
}

function switchDraftPeriod(draftKey, period) {
  var st = draftState[draftKey];
  if (!st) return;
  st.period = period;
  var text = getDraftText(st.product, period);
  st.originalText = text;
  var card = document.getElementById('draft-' + draftKey);
  var textarea = card.querySelector('.draft-textarea');
  textarea.value = text;
  card.querySelector('.cc-num').textContent = text.length;
  card.classList.remove('edited');
  var badge = card.querySelector('.compliance-badge');
  badge.className = 'compliance-badge passed';
  badge.innerHTML = '✓ 合规审核通过';
  card.querySelector('.reset-btn').disabled = true;
  card.querySelectorAll('.ps-item').forEach(function(item) {
    item.classList.toggle('active', item.dataset.period === period);
  });
}

function onDraftEdit(draftKey) {
  var st = draftState[draftKey];
  if (!st) return;
  var card = document.getElementById('draft-' + draftKey);
  var textarea = card.querySelector('.draft-textarea');
  var text = textarea.value;
  card.querySelector('.cc-num').textContent = text.length;
  var isEdited = text !== st.originalText;
  var badge = card.querySelector('.compliance-badge');
  var resetBtn = card.querySelector('.reset-btn');
  if (isEdited) {
    card.classList.add('edited');
    badge.className = 'compliance-badge pending';
    badge.innerHTML = '● 已编辑';
    resetBtn.disabled = false;
  } else {
    card.classList.remove('edited');
    badge.className = 'compliance-badge passed';
    badge.innerHTML = '✓ 合规审核通过';
    resetBtn.disabled = true;
  }
}

function resetDraft(draftKey) {
  var st = draftState[draftKey];
  if (!st) return;
  var card = document.getElementById('draft-' + draftKey);
  card.querySelector('.draft-textarea').value = st.originalText;
  onDraftEdit(draftKey);
  showToast('已恢复原始话术');
}

function copyDraft(draftKey) {
  var card = document.getElementById('draft-' + draftKey);
  var text = card.querySelector('.draft-textarea').value;
  copyToClipboard(text);
  showToast('话术已复制到剪贴板');
}

function copyToClipboard(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

// ===================== 其它工具函数 =====================
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function downloadReport(name, type) {
  if (type === 'image') {
    showToast('正在生成报告截图...（演示模式）');
    setTimeout(function() { showToast('图片已保存：' + name + '.png'); }, 1200);
  } else {
    var link = 'https://guojin.com/reports/' + name + '.html';
    copyToClipboard(link);
    showToast('报告链接已复制到剪贴板');
  }
}

// ===================== 初始化 =====================
renderCustomerDetail();
</script>

</html>
