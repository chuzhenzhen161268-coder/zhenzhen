  const originalCommunicationThoughts={"eligibleNoHoldingDone":{"title":"一、符合认证条件&没有私募持仓&已做过资配方案","content":"1、权益续期引导\n① 符合认证条件\n 合投认证指引.pdf\n“X总您好，我是国金证券您的专属投顾[名字]。今天给您打电话，是想跟您同步一个重要信息——您之前做的合格投资者（含私募、资管合格投资者认定）认证两年有效期即将在【X 月 X 日】到期，按规定需要完成一轮续期核验，才能继续享有专属产品认购和研究资源的优先权限。根据我们系统核查，您当前的账户资产依然符合合格投资者的认定标准，所以续期会非常顺畅。考虑到您资金体量较大，这个资格对您很重要，我建议我们提前两周处理，别让它断档。”\n② 告知+重新定义（针对当前没有私募持仓客户）\n我知道您现在账户里没有持仓，可能觉得这个认证跟您关系不大。但我其实想换个角度跟您说——\n合格投资者认证，是一个‘金融领域的VIP通道资格’。生活中很多好机会，往往都是留给‘有准备的人’——就像机场贵宾厅、高端俱乐部的会员资格，平时不用觉得没什么，但真到需要用的时候，临时办可能会花费更多时间。\n金融投资也是一样——市场机会往往是突发的，等您看到机会再想参与，如果手上没有有效的合格投资者认证，第一步就被挡在门外了。您可能现在不投，但保留这个资格本身，就是给自己保留一个选择权。放弃这个资格，等于主动放弃未来所有高门槛投资机会的入场券——我觉得对您来说，这个成本其实挺大的。”\n④引导外部资金转入（给可行的方案）\n“我知道您目前的账户资产离300万门槛还有一点差距，只需要在认证到期前，把资产补足到300/500万的门槛线就可以完成续期。\n我给您两个方案：\n方案一：把您在其他银行的闲置存款、理财资金或者其他券商/基金的股票或基金持仓归集一部分过来，凑到门槛线完成认证就行，认证通过后资金您可以自由安排；\n方案二：提供银行或者其他渠道的金融资产证明，认证时作为辅助材料上传即可。\n\n2、续期权益——资产配置服务一页通\n借这个节点，我也想和您回顾下您这两年享受到的尊享权益，看看哪些用上了、哪些还没充分用\n①已做过资配方案\n 素材：高客资产配置一页通_1000万_已做过资配客户.png\n 素材：高客资产配置一页通_500万_已做过资配客户.png\n您之前在我司也做过资配方案，从方案到落地，再到每一次跟踪，我们都在持续的为您提供持续的专业服务陪伴，相信您也能感受到我们用心服务。如果您合格投资者到期，未来再有合适的资配方案，再重新做可能就会错过最好的入场时机，所以建议您还是尽快续期。"},"eligibleNoHoldingNew":{"title":"二、符合认证条件&没有私募持仓&未做过资配方案","content":"1、权益续期引导\n① 符合认证条件\n 合投认证指引.pdf\n“X总您好，我是国金证券您的专属投顾[名字]。今天给您打电话，是想跟您同步一个重要信息——您之前做的合格投资者（含私募、资管合格投资者认定）认证两年有效期即将在【X 月 X 日】到期，按规定需要完成一轮续期核验，才能继续享有专属产品认购和研究资源的优先权限。根据我们系统核查，您当前的账户资产依然符合合格投资者的认定标准，所以续期会非常顺畅。考虑到您资金体量较大，这个资格对您很重要，我建议我们提前两周处理，别让它断档。”\n③ 告知+重新定义（针对当前没有私募持仓客户）\n我知道您现在账户里没有持仓，可能觉得这个认证跟您关系不大。但我其实想换个角度跟您说——\n合格投资者认证，是一个‘金融领域的VIP通道资格’。生活中很多好机会，往往都是留给‘有准备的人’——就像机场贵宾厅、高端俱乐部的会员资格，平时不用觉得没什么，但真到需要用的时候，临时办可能会花费更多时间。\n金融投资也是一样——市场机会往往是突发的，等您看到机会再想参与，如果手上没有有效的合格投资者认证，第一步就被挡在门外了。您可能现在不投，但保留这个资格本身，就是给自己保留一个选择权。放弃这个资格，等于主动放弃未来所有高门槛投资机会的入场券——我觉得对您来说，这个成本其实挺大的。”\n④引导外部资金转入（给可行的方案）\n“我知道您目前的账户资产离300万门槛还有一点差距，只需要在认证到期前，把资产补足到300/500万的门槛线就可以完成续期。\n我给您两个方案：\n方案一：把您在其他银行的闲置存款、理财资金或者其他券商/基金的股票或基金持仓归集一部分过来，凑到门槛线完成认证就行，认证通过后资金您可以自由安排；\n方案二：提供银行或者其他渠道的金融资产证明，认证时作为辅助材料上传即可。\n\n2、续期权益——资产配置服务一页通\n借这个节
