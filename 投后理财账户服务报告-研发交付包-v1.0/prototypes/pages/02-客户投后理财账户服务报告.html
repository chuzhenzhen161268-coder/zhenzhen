</style></head><body><main class="page"><section class="top"><div><h1 class="title">投后理财账户服务报告</h1><div class="sub">查看名下客户已完成的周报、月报及账户诊断，并基于对应报告开展服务触达</div><div class="generation-meta"><span>生成来源：员工消息任务</span><i></i><span>生成时间：2026-09-22 15:30</span></div></div><div class="metrics"><div class="metric"><label>服务客户</label><b>86</b></div><div class="metric"><label>报告任务</label><b>258</b></div><div class="metric"><label>已完成</label><b>241</b></div></div></section><div class="workspace"><aside class="panel"><div class="head"><h2>服务客户（86）</h2></div><div class="searchwrap"><input id="search" class="search" placeholder="搜索客户姓名或资金账号"></div><button class="broadcast" onclick="openBroadcast()"><span>✈　企微一键群发</span><span>⌄</span></button><div class="tip">已成功触达客户不可再次勾选</div><div class="list" id="customerList"></div></aside><section class="panel"><div class="detail" id="detail"></div></section></div></main><div id="mask" class="mask" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><b id="modalTitle">报告预览</b><button class="close" onclick="closeModal()">×</button></div><div id="modalBody" class="modalbody"></div><div class="modalfoot"><button class="btn primary" onclick="closeModal()">关闭</button></div></div></div><div id="drawerMask" class="mask" onclick="if(event.target===this)closeDrawer()"></div><aside id="drawer" class="drawer"><div class="drawerhead"><div><b id="drawerTitle">小 C 标准方案</b><div class="small">默认不勾选；勾选后可随本客户服务内容进入群发确认</div></div><button class="close" onclick="closeDrawer()">×</button></div><div id="schemeList" class="drawerbody"></div><div class="drawerfoot"><span id="schemeCount" class="muted">已选择 0 档方案</span><button class="btn primary" onclick="confirmSchemes()">加入企微群发</button></div></aside><div id="toast" class="toast"></div><script>
const customers=[{name:'张晓雯',account:'010238',risk:'C3（中风险承受）',total:'682.4 万',finance:'516.8 万',hold:'公募、私募',reports:{weekly:'ok',monthly:'ok',diagnosis:'ok'}},{name:'李承泽',account:'019472',risk:'C4（中高风险承受）',total:'648.5 万',finance:'472.8 万',hold:'公募',reports:{weekly:'ok',monthly:'error',diagnosis:'ok'}},{name:'周思远',account:'023108',risk:'专业投资者（无需测评）',total:'438.2 万',finance:'312.6 万',hold:'私募',reports:{weekly:'ok',monthly:'ok',diagnosis:'ok'}}];const info={weekly:{tab:'理财账户周报',time:'2026-09-22 更新',title:'账户本周复盘',summary:'本周理财账户收益 +0.42%，权益类资产贡献主要收益，整体波动处于风险承受范围内。',speech:'您好，这是您的本周理财账户周报。我已将账户表现和需要关注的变化做了整理，您可以先查看。'},monthly:{tab:'理财账户月报',time:'2026-09-01 更新',title:'账户月度复盘',summary:'本月账户收益 +1.86%，固收资产维持底仓稳定，海外权益配置带来主要增量。',speech:'您好，这是您的理财账户月报。我结合本月表现整理了收益来源和资产配置变化，供您查阅。'},diagnosis:{tab:'诊断与优化报告',time:'2026-09-03 更新',title:'账户诊断与优化建议',summary:'账户整体风险等级与客户画像基本匹配，权益资产占比略高于同风险等级建议区间，建议关注资产分散与流动性安排。',speech:'您好，我已为您完成理财账户诊断与优化分析，并整理了当前结构的关注点和建议，欢迎随时沟通。'}};let selected=0,tab='weekly',states={weekly:{tries:0,fail:false,edited:false},monthly:{tries:0,fail:false,edited:false},diagnosis:{tries:0,fail:false,edited:false}},drawerKind='',chosen={small:new Set(),big:new Set()};const $=x=>document.getElementById(x);function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function renderList(){let q=$('search').value.trim(),rows=customers.filter(c=>(c.name+c.account).includes(q));$('customerList').innerHTML=rows.length?rows.map(c=>{let i=customers.indexOf(c);return `<div class="customer ${i===selected?'active':''}" onclick="selectCustomer(${i})"><div class="line"><span class="name">${c.name}</span><span class="risk">${c.risk}</span></div><div class="small">资金账号 ${c.account}</div><div class="small">整体持仓 ${c.total}</div></div>`}).join(''):'<div class="empty">未找到匹配客户</div>'}function selectCustomer(i){selected=i;tab='weekly';states={weekly:{tries:0,fail:false,edited:false},monthly:{tries:0,fail:false,edited:false},diagnosis:{tries:0,fail:false,edited:false}};renderList();renderDetail()}function renderDetail(){let c=customers[selected],x=info[tab],status=c.reports[tab];$('detail').innerHTML=`<div class="detailtop"><div><h1>${c.name} · 理财账户服务详情</h1><div class="muted">资金账号 ${c.account}　·　${c.risk}　·　持有 ${c.hold}</div></div></div><div class="stats"><div class="stat"><label>客户整体持仓</label><b>${c.total}</b></div><div class="stat"><label>客户理财持仓</label><b>${c.finance}</b></div><div class="stat"><label>最近服务时间</label><b style="font-size:14px">2026-09-22</b></div></div><div class="tabs">${Object.entries(info).map(([k,v])=>`<button class="${k===tab?'active':''}" onclick="switchTab('${k}')">${v.tab}${c.reports[k]==='error'?' · 异常':''}</button>`).join('')}</div><div id="reportArea"></div>`;renderReport(c,x,status)}function switchTab(k){tab=k;renderDetail()}function renderReport(c,x,status){if(status==='error'){$('reportArea').innerHTML=`<div class="card"><div class="cardhead"><b>${x.title}</b><span class="status error">生成异常</span></div><div class="body"><p>本报告暂未生成成功，其他已完成报告不受影响。</p><button class="btn primary" onclick="retryReport()">重新生成报告</button></div></div>`;return}let s=states[tab],blocked=s.fail&&!s.edited;$('reportArea').innerHTML=`<div class="card"><div class="cardhead"><b>${x.title}</b><div class="actions"><button class="btn" onclick="previewReport()">查看完整报告</button><button class="btn" onclick="download('${x.title}')">下载图片</button></div></div><div class="body"><div class="meta">${x.time}</div>${x.summary}${tab==='diagnosis'?materials(c):''}</div></div><div class="card"><div class="cardhead"><b>沟通话术</b>${blocked?'<span class="status error">待人工编辑</span>':'<span class="status ok">合规通过</span>'}</div><div class="body"><div class="speech ${blocked?'bad':''}">${blocked?'AI生成话术未通过合规审核，请自行编辑话术':x.speech}</div><div class="actions" style="margin-top:12px">${blocked?'<button class="btn primary" onclick="editSpeech()">编辑话术</button>':'<button class="btn" onclick="copySpeech()">复制话术</button><button class="btn primary" onclick="sendSingle()">企微发送</button><button class="btn" onclick="simulateFail()">[演示] 模拟合规失败</button>'}</div></div></div>`}function materials(c){let h='';if(c.hold.includes('公募'))h+=card('small','小 C 标准方案','适用于公募产品持仓客户，含 5 档标准配置方案。');if(c.hold.includes('私募'))h+=card('big','大 C 标准方案','适用于私募产品持仓客户，含 5 档标准配置方案。');return `<div class="card" style="margin:16px 0 0"><div class="cardhead"><b>标准方案素材</b><span class="muted">公共标准内容，不参与话术生成</span></div><div class="body"><div class="materials">${h}</div></div></div>`}function card(k,t,d){return `<div class="material"><h3>${t}</h3><p>${d}</p><button class="btn" onclick="openDrawer('${k}')">查看 5 档方案</button></div>`}function retryReport(){customers[selected].reports[tab]='ok';toast('报告已重新生成并完成话术审核');renderDetail()}function previewReport(){$('modalTitle').textContent=info[tab].title+' · 完整报告';$('modalBody').innerHTML=`<b>${info[tab].title}</b><p>${info[tab].summary}</p><p>报告包含账户表现、资产结构、收益贡献与风险匹配等分析。本页面为交互演示，下载操作将模拟获得完整长图报告。</p>`;$('mask').classList.add('show')}function closeModal(){$('mask').classList.remove('show')}function download(n){toast('《'+n+'》已准备下载')}function copySpeech(){navigator.clipboard?.writeText(info[tab].speech);toast('话术已复制')}function sendSingle(){toast('已通过企微发送给 '+customers[selected].name)}function simulateFail(){states[tab].tries++;if(states[tab].tries>=3){states[tab].fail=true;toast('已连续 3 次未通过合规审核，请人工编辑')}else toast('未通过合规审核，已自动重新生成（'+states[tab].tries+'/3）');renderDetail()}function editSpeech(){let t=prompt('编辑话术：',info[tab].speech);if(t!==null&&t.trim()){info[tab].speech=t.trim();states[tab].edited=true;toast('已保存人工编辑话术，复制与企微发送已恢复');renderDetail()}}const names=['低波动方案','中低波动方案','中波动方案','中高波动方案','高波动方案'];function openDrawer(k){drawerKind=k;$('drawerTitle').textContent=(k==='small'?'小 C':'大 C')+' 标准方案';renderSchemes();$('drawerMask').classList.add('show');$('drawer').classList.add('show')}function closeDrawer(){$('drawerMask').classList.remove('show');$('drawer').classList.remove('show')}function renderSchemes(){let set=chosen[drawerKind];$('schemeList').innerHTML=names.map((n,i)=>`<div class="scheme"><div class="schemetop"><input type="checkbox" ${set.has(i)?'checked':''} onchange="toggleScheme(${i},this.checked)"><b>${n}</b><button class="btn" onclick="previewScheme(${i})">预览</button><button class="btn" onclick="download('${n}')">下载</button></div><p>标准方案长图素材 · ${drawerKind==='small'?'小 C':'大 C'} · 不与客户画像或话术联动</p></div>`).join('');$('schemeCount').textContent='已选择 '+set.size+' 档方案'}function toggleScheme(i,on){on?chosen[drawerKind].add(i):chosen[drawerKind].delete(i);renderSchemes()}function previewScheme(i){$('modalTitle').textContent=names[i]+' · 方案预览';$('modalBody').innerHTML=`<div style="height:420px;background:#f5f7fa;border:1px dashed #98a2b3;padding:28px"><b>${drawerKind==='small'?'小 C':'大 C'} · ${names[i]}</b><p>方案长图预览区域</p><p>配置思路、适配范围、策略要点与风险提示将在长图中展示。</p></div>`;$('mask').classList.add('show')}function confirmSchemes(){let n=chosen.small.size+chosen.big.size;if(!n){toast('请先勾选需要加入群发的方案');return}closeDrawer();openBroadcast()}function openBroadcast(){let schemes=[...chosen.small].map(i=>'小 C · '+names[i]).concat([...chosen.big].map(i=>'大 C · '+names[i]));$('modalTitle').textContent='企微一键群发';$('modalBody').innerHTML=`<p>将向勾选客户发送其已通过合规的报告话术${schemes.length?'及以下标准方案素材：':''}</p>${schemes.length?'<p class="speech">'+schemes.join('\n')+'</p>':''}${customers.slice(0,2).map(c=>`<label style="display:flex;padding:10px 0;border-bottom:1px solid #eee"><input type="checkbox" checked style="margin-right:9px">${c.name}<span style="margin-left:auto;color:#667085">${c.risk}</span></label>`).join('')}<p class="small">已成功触达客户不可再次勾选</p>`;$('mask').classList.add('show')}$('search').oninput=renderList;renderList();renderDetail();
</script><script>
/* 演示客户用于固定呈现“话术三次审核失败 → 人工编辑恢复”的异常分支。 */
customers.push({name:'王海宁',account:'031586',risk:'C3（中风险承受）',total:'356.8 万',finance:'268.4 万',hold:'公募',demoComplianceFailed:true,reports:{weekly:'ok',monthly:'ok',diagnosis:'ok'}});

const baseSelectCustomer=selectCustomer;
selectCustomer=function(i){
  baseSelectCustomer(i);
  if(customers[i].demoComplianceFailed){
    states.weekly={tries:3,fail:true,edited:false};
    renderDetail();
  }
};

const baseRenderReport=renderReport;
renderReport=function(customer, report, status){
  baseRenderReport(customer, report, status);
  const actionBar=$('reportArea')?.querySelector('.card:last-child .actions');
  if(actionBar){
    actionBar.querySelectorAll('button').forEach(button=>{
      const label=button.textContent.trim();
      if(label==='企微发送'||label.includes('模拟合规失败')) button.remove();
    });
  }
};

const baseRenderList=renderList;
renderList=function(){
  baseRenderList();
  document.querySelectorAll('#customerList .customer').forEach(row=>{
    if(row.textContent.includes('王海宁')){
      const tag=document.createElement('div');
      tag.className='small';
      tag.style.color='#b42318';
      tag.textContent='周报话术待人工编辑';
      row.appendChild(tag);
    }
  });
};
renderList();
renderDetail();
</script><script>
/* 合规失败的话术在卡片内完成编辑，避免跳出当前服务上下文。 */
editSpeech=function(){
  const card=$('reportArea')?.querySelector('.card:last-child');
  if(!card)return;
  const speech=card.querySelector('.speech');
  const actions=card.querySelector('.actions');
  if(!speech||!actions)return;
  const original=info[tab].speech;
  speech.outerHTML=`<textarea id="inlineSpeechEditor" aria-label="编辑沟通话术" style="width:100%;min-height:126px;resize:vertical;border:1px solid #98a2b3;border-radius:6px;padding:11px 12px;line-height:1.75;color:#344054;outline-color:#2b73ff">${original}</textarea>`;
  actions.innerHTML='<button class="btn" onclick="cancelInlineEdit()">取消</button><button class="btn primary" onclick="saveInlineEdit()">保存并恢复复制</button>';
};
cancelInlineEdit=function(){renderDetail()};
saveInlineEdit=function(){
  const editor=$('inlineSpeechEditor');
  const value=editor?.value.trim();
  if(!value){toast('请输入沟通话术');return;}
  info[tab].speech=value;
  states[tab].edited=true;
  toast('已保存人工编辑话术，复制能力已恢复');
  renderDetail();
};
</script><script>
/* 人工编辑是人工兜底态，不沿用 AI 话术“合规通过”标签。 */
const renderReportBeforeManualLabel=renderReport;
renderReport=function(customer, report, status){
  renderReportBeforeManualLabel(customer, report, status);
  if(states[tab]?.edited){
    $('reportArea')?.querySelector('.card:last-child .status.ok')?.remove();
  }

      // keydown 放行 cmd/ctrl + C / A：复制 + 全选是文字可选语义的硬前提
      if (e.type === 'keydown') {
        var meta = e.metaKey || e.ctrlKey;
        var k = (e.key || '').toLowerCase();
        if (meta && (k === 'c' || k === 'a')) return;
      }
      e.preventDefault();
      // capture 阶段 stopImmediatePropagation 会终止 target phase 的行内 onclick
      e.stopImmediatePropagation();
    }

    function forwardWheel(e) {
      e.preventDefault();
      e.stopImmediatePropagation();

        parent.postMessage({
          type: 'canvas-wheel',
          deltaX: e.deltaX, deltaY: e.deltaY, deltaMode: e.deltaMode,
          ctrlKey: e.ctrlKey, metaKey: e.metaKey,
          clientX: e.clientX, clientY: e.clientY

      } catch (err) {}
    }

      .forEach(function (ev) { document.addEventListener(ev, swallow, true); });

    // 导致 iframe 内背景滚动锁不住（浮层下面的 state 仍可滑）
    document.addEventListener('touchmove', swallow, { capture: true, passive: false });

      }

  // 独立 origin，contentDocument 恒为 null（Chromium 静默返回 null 而非抛错），脚本永远进不来。

    var active = false;

    function ensureHl() {

      if (!hl) {
        hl = document.createElement('div');
        hl.id = HL_ID;
        hl.style.cssText = 'position:fixed;pointer-events:none;z-index:2147483646;border:2px solid #F93838;'
          + 'background:rgba(249,56,56,0.08);transition:all .08s;display:none;box-sizing:border-box;border-radius:2px;';
        document.documentElement.appendChild(hl);
      }
      return hl;

      if (!(el instanceof Element)) return '';
      var parts = [];

        var seg = el.nodeName.toLowerCase();

        if (el.className && typeof el.className === 'string') {
          var cls = el.className.trim().split(/\s+/).filter(function (c) {
            return c && c.indexOf('__picker') !== 0;
          }).slice(0, 2).join('.');
          if (cls) seg += '.' + cls;
        }
        var parent = el.parentNode;
        if (parent && parent.nodeType === 1) {
          var sib = Array.prototype.slice.call(parent.children).filter(function (x) {
            return x.nodeName === el.nodeName;
          });
          if (sib.length > 1) seg += ':nth-of-type(' + (sib.indexOf(el) + 1) + ')';
        }
        parts.unshift(seg);
        el = el.parentElement;
      }

      };

  // 而页面里任何「跟视口等高」的撑满约束（min-h-screen / min-height:100vh）都会让下一次
  // scrollHeight 再高出同一个固定偏移，构成无限放大的正反馈（实测能涨到 17000px+）。
  // 所以测量前把这类约束临时中和，只留内容真正撑出来的高度；下限由父画布按视口档位补。

    try {
      neutralize(document.documentElement);
      neutralize(body);

      for (var k = 0; k < touched.length; k++) {
        var t = touched[k];
        if (t[1]) t[0].style.setProperty('min-height', t[1], t[2]);
        else t[0].style.removeProperty('min-height');
      }
      measuring = false;
    }
  }

    // 只报真实内容高度、不设下限：视口档位（APP 手机壳 812 / 中台宽屏 800）由父画布按

    var h = naturalHeight();
    try {

    } catch (e) {}
  }

    var origRAF = window.requestAnimationFrame.bind(window);
    activate(getFrameKey());
    disableInteractions();

    report();
    setTimeout(report, 250);
    setTimeout(report, 1200);
    window.addEventListener('load', report);

    }

    if (window.ResizeObserver) {

  }

    activate(getFrameKey());
    setTimeout(reportHeight, 100);
  });

/* 最终覆盖：客户详情方案区固定在沟通话术之后。 */
</style><script>
const accountRenderReportWithSpeech=renderReport;
renderReport=function(customer,report,status){
  accountRenderReportWithSpeech(customer,report,status);

<script>
/* 最终定位修正：沿用现有标准方案模块视觉，移动到沟通话术后并改名。 */
(function(){
  const moveCustomerFiveSchemeModule=()=>{
    const detail=document.getElementById('detail');
    if(!detail)return;
    /* 统一保留客户详情中的最终方案模块，移除历史脚本遗留的重复模块。 */
    detail.querySelectorAll('.customer-schemes').forEach(node=>node.remove());
    const module=detail.querySelector('.customer-materials-card');
    if(!module)return;
    const title=module.querySelector('.cardhead b');
    if(title)title.textContent='客户五档方案素材';
    const cards=[...detail.querySelectorAll('#reportArea .card')];
    const speechCard=cards.find(card=>card.querySelector('.cardhead b')?.textContent.trim()==='沟通话术');
    if(speechCard)speechCard.insertAdjacentElement('afterend',module);
  };
  const previousRenderDetail=window.renderDetail;
  window.renderDetail=function(){previousRenderDetail();moveCustomerFiveSchemeModule();};
  moveCustomerFiveSchemeModule();
})();
</script>
<script>
/* 最终兜底：正式页面不展示合规失败模拟按钮。 */
(function(){
  const removeDemoButton=()=>document.querySelectorAll('#reportArea button').forEach(button=>{
    if((button.textContent||'').includes('模拟合规失败'))button.remove();
  });
  removeDemoButton();
  const area=document.getElementById('reportArea');
  if(area)new MutationObserver(removeDemoButton).observe(area,{childList:true,subtree:true});
})();
</script>
