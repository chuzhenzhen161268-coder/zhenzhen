        {title:'第一步｜开场：身份仪式，先给价值',content:`xx总您好，我是您的专属投顾 XX，跟您同步个好消息——根据最新的账户核验，您的账户已正式符合【私募基金合格投资者】标准。这意味着您已经解锁我们「AI+尊享服务」的专属权益体系，几个对您最直接的变化`},

股票：即便您不做配置、只做股票，这个层级能享受到的服务也有升级。我们会为您提供投研深度服务，包含上市公司调研、专家交流、策略会，您有优先席位，还会为您提供深度研报等；季度持仓体检，帮您进行集中度与风格体检、交易行为复盘等。这些跟您买不买产品没关系，是您在这个层级本来就该享有的。`}

        {title:'第二步｜服务体系介绍',content:`（如若之前未介绍过300万服务内容需一并介绍）

      ]
